#==================
spring.datasource.url=jdbc:postgresql://<APNA_EXACT_POOLER_HOST>:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.hdlgivnbugwtcgpikfg
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=55000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
